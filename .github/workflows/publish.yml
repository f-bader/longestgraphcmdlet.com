name: Publish data snapshot

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      full_collection:
        description: "Rebuild all Microsoft.Graph history instead of the recent window"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-data-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COLLECTION_DAYS: "7"
      FULL_COLLECTION: ${{ inputs.full_collection || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore previous snapshot state
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/graph-snapshot.json
            .cache/command-summaries
          key: graph-snapshot-v2-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            graph-snapshot-v2-${{ github.ref_name }}-

      - name: Collect and validate PowerShell Gallery snapshot
        run: npm run collect && npm run check

      - name: Deploy validated Worker
        run: npx wrangler deploy

      - name: Save snapshot state
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/graph-snapshot.json
            .cache/command-summaries
          key: graph-snapshot-v2-${{ github.ref_name }}-${{ github.run_id }}
